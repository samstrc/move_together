# Move Together: database, backend, and frontend for local development.
# How to run it, addresses, and database connection details: see README.md.

services:
  db:
    image: postgres:18
    container_name: move_together_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: relationalrebels
      POSTGRES_PASSWORD: password
      POSTGRES_DB: move_together
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
      # Scripts in this folder run once, when the database is first created.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relationalrebels -d move_together"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: move_together_api
    # SECRET_KEY and LLM_API_KEY come from backend/.env (copy .env.example).
    env_file: backend/.env
    environment:
      # Inside Docker the database is reached by its service name, "db",
      # not localhost. This overrides DATABASE_URL from backend/.env.
      DATABASE_URL: postgresql://relationalrebels:password@db:5432/move_together
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv          # hide your Mac's .venv from the container
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    container_name: move_together_web
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Keep the container's own node_modules (built for Linux) instead of
      # your Mac's, which has Mac-only binaries.
      - /app/node_modules
    depends_on:
      - api

volumes:
  db_data:
