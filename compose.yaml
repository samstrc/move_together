# Local PostgreSQL for Move Together.
#
#   docker compose up -d      start the database (first run also loads db/init.sql)
#   docker compose down       stop it (your data is kept)
#   docker compose down -v    stop it AND delete all data, so init.sql reruns next time
#
# Connect with: postgresql://relationalrebels:password@localhost:5432/move_together

services:
  db:
    image: postgres:18
    container_name: move_together_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: relationalrebels
      POSTGRES_PASSWORD: password
      POSTGRES_DB: move_together
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
      # Scripts in this folder run once, when the database is first created.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relationalrebels -d move_together"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
